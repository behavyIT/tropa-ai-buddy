topic: sentry
title: Sentry
doc: sentry
pass_ratio: 0.6
prompt: "Расскажи своими словами: что такое Sentry, какую проблему он решает и как ты будешь им пользоваться в команде. Одного сообщения на 4–6 предложений достаточно — я послушаю и подскажу, что упущено."
concepts:
  - id: errors
    label: Собирает ошибки и исключения из приложений
    keywords: [ошибк, исключен, exception, error, паник, panic, сбо, падени]
    hint: "Sentry через SDK автоматически собирает ошибки и необработанные исключения из сервисов."
  - id: context
    label: Даёт контекст — стектрейс, окружение, релиз
    keywords: [стек, stack, трейс, trace, контекст, окружени, environment, breadcrumb, тег]
    hint: "Ценность Sentry — в контексте: стектрейс, окружение, теги, breadcrumbs помогают воспроизвести проблему."
  - id: grouping
    label: Группирует одинаковые события в issues
    keywords: [группир, issue, ишью, дубл, похож, одинаков, событи]
    hint: "Одинаковые события группируются в issue, поэтому видно масштаб: сколько раз и у скольких пользователей."
  - id: alerts
    label: Оповещает команду через алерты
    keywords: [алерт, alert, уведомл, оповещ, нотифика, канал]
    hint: "По правилам алертинга Sentry оповещает команду о новых или участившихся ошибках."
  - id: releases
    label: Связывает ошибки с релизами и помогает ловить регрессии
    keywords: [релиз, release, регресс, верси, деплой, выкатк]
    hint: "Привязка к релизам показывает, после какой выкатки появилась ошибка — так ловят регрессии."
  - id: triage
    label: Помогает разбирать и назначать ответственного
    keywords: [назнач, ответствен, assign, разбор, разбира, триаж, triage, приоритет, чин]
    hint: "Issue можно назначить ответственному, пометить решённой или проигнорировать — это часть дежурного разбора."
