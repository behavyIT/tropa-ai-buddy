contacts:
  - topic: Доступы и права
    keywords: [доступ, прав, gitlab, jira, confluence, k8s, kubernetes, кубер, lens, grafana, sentry, kafka]
    person: u-lead-maria
    how: "Стандартные доступы выдаются автоматически по заявке. Нестандартные (k8s-staging, kafka-ui) согласует руководитель — Мария. Подать заявку можно прямо через Тропу."
  - topic: Отгул, отпуск, график
    keywords: [отгул, отпуск, выходн, график, отсутств, day off]
    person: u-lead-maria
    how: "Отгул согласует руководитель в сервисе отсутствий. Наставника достаточно предупредить. Тропа подготовит заявку."
  - topic: Код-ревью, первые задачи, вопросы по коду
    keywords: [ревью, review, mr, merge, код, задач, good-first-issue, ветк, тест]
    person: u-mentor-artem
    how: "Сначала поищи ответ в материалах команды, потом пиши Артёму. Несрочные вопросы удобно копить — Тропа соберёт их в сводку к его ежедневному разбору в 16:00."
  - topic: Инфраструктура, staging, CI/CD
    keywords: [staging, стейдж, деплой, deploy, ci, cd, pipeline, пайплайн, сборк, docker]
    person: u-mentor-artem
    channel: "#ads-backend-dev (тестовый канал)"
    how: "Падения пайплайнов и вопросы по staging — в канал команды, с ссылкой на пайплайн. Если горит — сразу Артёму."
  - topic: Стажировка, документы, экватор, практика
    keywords: [hr, документ, справк, практик, учебн, куратор, экватор, выпускн, стажировк, оценк, ревью компетенц]
    person: u-hrbp-olga
    how: "Организационные вопросы стажировки — HR BP Ольге. Вопросы оценки сначала обсуди с наставником на 1:1."
